<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viral em 1 Minuto — Viralize sem edição, sem dancinha, sem anúncio</title>

    <!-- DNS prefetch para origens externas -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- CSS CRÍTICO INLINE — apenas o necessário para pintar a dobra principal sem aguardar download -->
    <style>
        @font-face {
            font-family: 'Poppins';
            font-style: normal;
            font-weight: 800;
            font-display: swap;
            src: url(assets/fonts/poppins-800-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD
        }

        :root {
            --primary: #FFF4E6;
            --secondary: #C8F000;
            --accent: #FF2D7A;
            --bg: #fff;
            --ink: #1A1A1A;
            --ink-soft: #4d4d4d;
            --line: rgba(26, 26, 26, .08);
            --radius-btn: 50px;
            --radius-card: 32px;
            --font-head: 'Poppins', system-ui, sans-serif;
            --font-body: 'Poppins', system-ui, sans-serif;
            --container: 1240px;
            --playful: .5;
            --glass-bg: rgba(255, 255, 255, .45);
            --glass-border: rgba(255, 255, 255, .6);
            --blur: blur(16px)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font-body);
            background: radial-gradient(ellipse 80% 60% at 90% 0%, rgba(255, 45, 122, .08), transparent 60%), radial-gradient(ellipse 70% 60% at 10% 100%, rgba(207, 255, 4, .08), transparent 60%), linear-gradient(180deg, #fff4e6 0%, #fff6eb 20%, #fff1e8 40%, #fff8ef 60%, #fff3ea 80%, #fff4e6 100%);
            background-attachment: fixed;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh
        }

        a {
            color: var(--accent);
            text-decoration: none
        }

        img {
            max-width: 100%;
            display: block
        }

        .container {
            max-width: var(--container);
            margin: 0 auto;
            padding: 0 30px
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: var(--font-head);
            font-weight: 800;
            line-height: .98;
            letter-spacing: -.02em;
            margin: 0
        }

        h1 {
            font-size: clamp(42px, 6vw, 88px)
        }

        h2 {
            font-size: clamp(34px, 4.5vw, 64px)
        }

        h3 {
            font-size: clamp(22px, 2vw, 30px)
        }

        p {
            line-height: 1.5;
            margin: 0
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-head);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: 11px;
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, .6);
            border-radius: 50px;
            background: rgba(255, 255, 255, .35);
            color: var(--ink)
        }

        .eyebrow .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent)
        }

        .highlight-pink {
            color: var(--accent)
        }

        .highlight-lime {
            background: var(--secondary);
            padding: 0 .15em;
            display: inline-block;
            border-radius: 8px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 17px;
            padding: 16px 28px;
            border-radius: var(--radius-btn);
            border: 1px solid rgba(26, 26, 26, .08);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF5B94, var(--accent));
            color: #fff;
            box-shadow: 0 12px 24px rgba(255, 45, 122, .3)
        }

        .btn-lg {
            font-size: 19px;
            padding: 20px 34px
        }

        .nav {
            position: sticky;
            top: 14px;
            z-index: 40;
            margin: 14px auto 0;
            max-width: calc(var(--container) + 20px);
            padding: 0 20px
        }

        .nav-inner {
            background: rgba(255, 255, 255, .65);
            border: 1px solid rgba(26, 26, 26, .08);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 10px 20px
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800
        }

        .nav-logo img {
            height: 38px;
            width: auto
        }

        .nav-links {
            display: flex;
            gap: 26px;
            font-weight: 600;
            font-size: 15px
        }

        .nav-links a {
            color: var(--ink)
        }

        @media (max-width:820px) {
            .nav-links {
                display: none
            }
        }

        .hero {
            position: relative;
            padding: 70px 0 60px;
            overflow: hidden
        }

        /* Alpha button crítico */
        .alpha-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 36px;
            border-radius: 50px;
            background: linear-gradient(135deg, #FF5B94, #FF2D7A);
            color: #fff;
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(255, 45, 122, .35);
            cursor: pointer
        }

        .shimmer-effect {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
            animation: shimmer 2.5s infinite
        }

        @keyframes shimmer {
            0% {
                left: -100%
            }

            100% {
                left: 200%
            }
        }

        .hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .05);
            opacity: 0;
            transition: opacity .2s
        }

        .alpha-btn:hover .hover-overlay {
            opacity: 1
        }

        .btn-content {
            position: relative;
            z-index: 1
        }

        /* VSL */
        .vsl-wrap {
            width: 100%
        }

        .vsl-frame {
            position: relative
        }

        .vsl-aspect {
            position: relative;
            padding-bottom: 56.25%;
            background: #1a1a1a
        }

        .vsl-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d)
        }

        .play {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, .3)
        }

        .cap {
            font-size: 13px;
            color: rgba(255, 255, 255, .6);
            letter-spacing: .08em;
            font-family: monospace
        }

        /* Hero */
        .hero-grid {
            display: grid;
            gap: 48px
        }

        .hero-sub {
            font-size: clamp(16px, 2vw, 20px);
            color: var(--ink-soft);
            margin-top: 20px
        }

        /* Glitch badge */
        .glitch-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(26, 26, 26, .08);
            background: rgba(255, 255, 255, .6);
            overflow: hidden
        }

        .glitch-badge__text {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            position: relative;
            z-index: 1
        }

        /* Sel dots */
        .sel-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%
        }

        .sel-dot.tl {
            margin-right: 6px
        }

        .sel-dot.br {
            margin-left: 6px
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.08)
            }
        }

        /* selected text highlight */
        .selected-text--lime {
            background: var(--secondary);
            padding: 0 .15em;
            border-radius: 8px
        }
    </style>

    <!-- Preload assets críticos -->
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-800-latin.woff2" crossorigin
        fetchpriority="high">
    <link rel="preload" as="image" href="assets/logo-viral.webp?v=2" fetchpriority="high">

    <!-- React + ReactDOM via jsDelivr: preload para download paralelo -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" as="script"
        crossorigin="anonymous">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" as="script"
        crossorigin="anonymous">
    <link rel="preload" href="dist/bundle-critical.js?v=59" as="script">

    <!-- CSS completo: carregado de forma não-bloqueante (não bloqueia FCP) -->
    <link rel="preload" href="dist/styles.css?v=31" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="dist/styles.css?v=31">
    </noscript>

    <!-- Fonte: não-bloqueante -->
    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap">
    </noscript>

</head>

<body>

    <div id="root"></div>
    <div id="deferred-root"></div>

    <!-- Carregamento ordenado no final do body: React → ReactDOM → bundle-critical -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
        crossorigin="anonymous"></script>
    <script src="dist/bundle-critical.js?v=59"></script>

</body>

</html>
